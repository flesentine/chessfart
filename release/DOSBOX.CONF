# Chess Fart 1.0.0-rc1 sample DOSBox configuration
[sdl]
fullscreen=false

[dosbox]
machine=svga_s3
memsize=16

[cpu]
core=auto
cputype=386
cycles=20000
cycleup=5000
cycledown=5000

[mixer]
rate=44100
blocksize=1024
prebuffer=20

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
mixer=true
oplmode=auto
oplemu=default
oplrate=44100

[speaker]
pcspeaker=true
pcrate=44100

[autoexec]
# Run DOSBox from the extracted CHESSFRT directory, or change this path.
mount c .
c:
set BLASTER=A220 I7 D1 H5 T6
CHESSFRT.EXE
