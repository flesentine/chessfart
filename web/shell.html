<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Fart — Web</title>
<link rel="icon" href="data:,">
<style>
:root{
  color-scheme:dark;
  --bg:#050911;
  --bg-top:#111a29;
  --panel:#101722;
  --panel-raised:#151e2c;
  --edge:#2c3f5e;
  --copper:#875d31;
  --gold:#e7b739;
  --cyan:#35d7d2;
  --gas:#a9dc55;
  --text:#f0e5cb;
  --muted:#98a1ae;
  --danger:#d47a62;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% -10%,#192640 0,var(--bg-top) 25%,#090e17 58%,#030508 100%);
  color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
body{display:flex;justify-content:center;padding:20px;touch-action:manipulation}
.wrap{width:min(980px,100%);text-align:center}
.brand{
  color:var(--gold);
  letter-spacing:.16em;
  font-size:clamp(20px,3.2vw,32px);
  font-weight:700;
  margin:1px 0 2px;
  text-shadow:0 1px 0 #000,0 0 18px #e7b73918;
}
.tag{font-size:12px;margin-bottom:14px;letter-spacing:.025em}
.tagline{color:var(--cyan)}
.edition{color:var(--muted)}
.machine{
  display:block;
  width:min(824px,100%);
  margin:0 auto;
  background:#090e16;
  border:1px solid var(--copper);
  border-radius:10px;
  padding:9px;
  box-shadow:
    0 18px 60px #000c,
    inset 0 0 0 1px var(--edge),
    inset 0 0 18px #0009;
}
#canvas{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:8/5;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  background:#000;
  outline:none;
  cursor:crosshair;
  box-shadow:0 0 0 1px #05070b;
}
#canvas:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
.status{
  display:inline-block;
  font-size:11px;
  color:var(--muted);
  margin:8px 0 0;
  padding:3px 8px;
  border:1px solid #26354e;
  border-radius:999px;
  background:#0a1019cc;
}
.control-deck{
  width:min(824px,100%);
  margin:12px auto 0;
  padding-top:11px;
  border-top:1px solid #27344a;
}
.controls{
  display:grid;
  grid-template-columns:repeat(3,58px);
  gap:5px;
  justify-content:center;
  margin:0 auto 10px;
}
.controls button,.actions button{
  font:inherit;
  color:var(--text);
  background:linear-gradient(#172131,#101721);
  border:1px solid #40506a;
  border-radius:6px;
  min-height:42px;
  box-shadow:inset 0 1px #ffffff12,0 1px 0 #000;
  cursor:pointer;
  transition:border-color .12s ease,background .12s ease,color .12s ease,transform .04s ease;
}
.controls button:hover,.actions button:hover{
  border-color:#687a98;
  background:linear-gradient(#1d2a3e,#131c29);
}
.controls button:focus-visible,.actions button:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:2px;
}
.controls button:active,.actions button:active{transform:translateY(1px)}
.controls button[data-k="10"]{
  color:var(--gold);
  border-color:#8d6b32;
  background:linear-gradient(#272216,#17150f);
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px 12px;
  justify-content:center;
  align-items:center;
  max-width:824px;
  margin:auto;
}
.action-group{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  justify-content:center;
  padding:4px;
  border:1px solid #26354b;
  border-radius:8px;
  background:#080d15a8;
}
.actions button{padding:7px 11px;min-height:38px}
.fart{
  color:#dff79b!important;
  border-color:#789e3f!important;
  background:linear-gradient(#1c2a18,#111b10)!important;
  box-shadow:inset 0 1px #dff79b18,0 0 12px #a9dc5510!important;
}
.session button{border-color:#50617a}
.utility button{color:#d6dbe3}
.settings button{color:var(--muted);border-color:#39465a}
.settings button[data-k="20"]{color:#d7ad78;border-color:#765638}
.settings button[data-k="1"]{color:#e6a08e;border-color:#72483f}
.help{
  max-width:760px;
  margin:10px auto 0;
  color:var(--muted);
  font-size:11px;
  line-height:1.55;
}
.kbd{color:var(--text)}
@media (min-width:760px) and (hover:hover) and (pointer:fine){.touch{display:none}}
@media (max-width:620px){
  body{padding:10px}
  .control-deck{margin-top:9px;padding-top:9px}
  .actions{gap:6px 8px}
  .action-group{padding:3px}
  .actions button{padding:7px 9px}
}
@media (max-width:480px){
  body{padding:8px}
  .machine{padding:6px;border-radius:7px}
  .brand{font-size:20px}
  .tag{font-size:10px;margin-bottom:9px}
  .controls{grid-template-columns:repeat(3,56px)}
  .help{font-size:10px}
}
@media (max-width:340px){
  body{padding:6px}
  .brand{font-size:18px;margin:0 0 1px}
  .tag{font-size:9px;margin-bottom:6px}
  .edition{display:none}
  .machine{padding:5px;border-radius:6px}
  .status{font-size:9px;margin-top:5px;padding:2px 6px}
  .control-deck{margin-top:6px;padding-top:6px}
  .controls{grid-template-columns:repeat(3,52px);gap:3px;margin-bottom:7px}
  .controls button{min-height:40px;font-size:13px}
  .actions{gap:4px}
  .action-group{display:contents}
  .actions button{min-height:36px;padding:5px 7px;font-size:11px}
  .help{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">CHESS FART</div>
  <div class="tag"><span class="tagline">Check. Mate. Ventilate.</span> <span class="edition">— browser/WASM edition</span></div>
  <div class="machine"><canvas id="canvas" width="320" height="200" tabindex="0" aria-label="Chess Fart game screen. Use the keyboard shortcuts or controls below."></canvas></div>
  <div id="status" class="status">Loading the 256-color ventilation engine…</div>

  <div class="control-deck">
    <div class="touch">
      <div class="controls">
        <button data-k="6" aria-label="Move northwest">↖</button><button data-k="2" aria-label="Move north">↑</button><button data-k="7" aria-label="Move northeast">↗</button>
        <button data-k="4" aria-label="Move west">←</button><button data-k="10">OK</button><button data-k="5" aria-label="Move east">→</button>
        <button data-k="8" aria-label="Move southwest">↙</button><button data-k="3" aria-label="Move south">↓</button><button data-k="9" aria-label="Move southeast">↘</button>
      </div>
    </div>
    <div class="actions">
      <div class="action-group primary">
        <button class="fart" data-k="11">FART (F)</button>
      </div>
      <div class="action-group session">
        <button data-k="12">SAVE</button><button data-k="13">LOAD</button><button data-k="18">REPLAY</button><button data-k="19">UNDO</button>
      </div>
      <div class="action-group utility">
        <button data-k="15">HELP</button><button data-k="16">LOG</button><button data-k="17">CREDITS</button>
      </div>
      <div class="action-group settings">
        <button data-k="14">CPU LEVEL</button><button data-k="20">THEME</button><button data-k="1">ESC</button>
      </div>
    </div>
    <div class="help">
      Desktop: <span class="kbd">arrows + Enter/Space</span>. Diagonals: <span class="kbd">Home / PgUp / End / PgDn</span>.
      Click the VGA screen to use the mouse; right-click enters Fart mode. Saves persist in this browser.
    </div>
  </div>
</div>
<script>
var Module = {
  canvas: document.getElementById('canvas'),
  cfKeyQueue: [],
  preRun: [function () {
    try { FS.mkdir('/persist'); } catch (_) {}
    FS.mount(IDBFS, {}, '/persist');
    addRunDependency('chessfart-idb');
    FS.syncfs(true, function (err) {
      if (err) console.warn('Chess Fart save restore:', err);
      removeRunDependency('chessfart-idb');
    });
  }],
  onRuntimeInitialized: function () {
    var status = document.getElementById('status');
    var compactStatus = window.matchMedia('(max-width:340px)');
    function syncStatusCopy() {
      status.textContent = compactStatus.matches ?
        'Ready' : 'Ready — click the VGA screen or use the controls.';
    }
    syncStatusCopy();
    if (compactStatus.addEventListener)
      compactStatus.addEventListener('change', syncStatusCopy);
    else
      compactStatus.addListener(syncStatusCopy);
    setInterval(function () { try { FS.syncfs(false, function () {}); } catch (_) {} }, 1500);
    Module.canvas.focus();
  },
  printErr: function (text) { console.error(text); }
};
function pushKey(k) {
  if (Module.cfPushKey) Module.cfPushKey(k);
  else if (Module.cfKeyQueue.length < 64) Module.cfKeyQueue.push(k|0);
  Module.canvas.focus();
}
document.querySelectorAll('[data-k]').forEach(function (b) {
  b.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    pushKey(parseInt(b.dataset.k,10));
  });
  b.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      e.stopPropagation();
      pushKey(parseInt(b.dataset.k,10));
    }
  });
});
window.addEventListener('beforeunload', function () { try { FS.syncfs(false, function () {}); } catch (_) {} });
</script>
{{{ SCRIPT }}}
</body>
</html>
