name: Release CI

on:
  push:
    branches: [ main, build12-rc ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test host release
        run: make test-build12

      - name: Set up Open Watcom 2.0 for DOS
        uses: open-watcom/setup-watcom@v1
        with:
          version: "2.0"
          target: "dos"

      - name: Build real 16-bit DOS executables
        run: sh scripts/build_dos_ci.sh

      - name: Install DOSBox smoke dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dosbox xvfb zip

      - name: Run DOS platform smoke
        run: |
          set +e
          timeout 30s xvfb-run -a env SDL_AUDIODRIVER=dummy dosbox -exit \
            -c "mount c $(pwd)/build/dos" \
            -c "c:" \
            -c "set BLASTER=A220 I7 D1 H5 T6" \
            -c "DOSSMOKE.EXE" \
            -c "exit"
          dosbox_status=$?
          set -e
          if [ "$dosbox_status" -ne 0 ] && [ "$dosbox_status" -ne 124 ]; then
            exit "$dosbox_status"
          fi
          test -s build/dos/DOSSMOKE.OK
          cat build/dos/DOSSMOKE.OK

      - name: Package 1.0.0
        run: sh scripts/package_release.sh

      - name: Preserve 1.0 build, diagnostics and previews
        uses: actions/upload-artifact@v4
        with:
          name: chessfart-1.0.0
          path: |
            build/release/chessfart-1.0.0-dos.zip
            build/release/chessfart-1.0.0-dos.zip.sha256
            build/dos/CHESSFRT.EXE
            build/dos/DOSSMOKE.OK
            build/host/PROFILE.txt
            build/host/SIZE.txt
            build/host/chessfart_build11.ppm
            build/host/chessfart_build11_title.ppm
            build/host/chessfart_build11_attract.ppm
            build/host/chessfart_build11_help.ppm
            build/host/chessfart_build11_history.ppm
            build/host/chessfart_build11_credits.ppm
            build/host/chessfart_build11_terminal.ppm
            build/host/chessfart_build11_audio.log
            build/host/chessfart_build11_fart.wav
            build/host/CHESSFRT.SAV
            build/host/CHESSFRT.CFG
