name: Host CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Chess Fart
        run: make test-build8
      - name: Preserve Build 8 previews and audio
        uses: actions/upload-artifact@v4
        with:
          name: chessfart-build8-preview
          path: |
            build/host/chessfart_build8.ppm
            build/host/chessfart_build8_title.ppm
            build/host/chessfart_build8_audio.log
            build/host/chessfart_build8_fart.wav
