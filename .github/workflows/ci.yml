name: Host CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Chess Fart
        run: make test-build10
      - name: Preserve Build 10 previews, audio and persistence
        uses: actions/upload-artifact@v4
        with:
          name: chessfart-build10-preview
          path: |
            build/host/chessfart_build9.ppm
            build/host/chessfart_build9_title.ppm
            build/host/chessfart_build9_audio.log
            build/host/chessfart_build9_fart.wav
            build/host/CHESSFRT.SAV
            build/host/CHESSFRT.CFG
