name: Host CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Chess Fart
        run: make test-build7
      - name: Preserve VGA preview
        uses: actions/upload-artifact@v4
        with:
          name: chessfart-build7-preview
          path: build/host/chessfart_build7.ppm
