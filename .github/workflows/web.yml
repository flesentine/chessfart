name: Web Build

on:
  push:
    branches: [ main, web-playable ]
  pull_request:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify Build 13 assets
        run: |
          python3 tools/build_assets.py --check
          python3 tools/build_font.py --check
          python3 -m unittest tests/test_build13_assets.py tests/test_build13_font.py
          cat build/assets/ASSET_REPORT.txt
          cat build/assets/FONT_REPORT.txt
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.1
          actions-cache-folder: emsdk-cache
      - name: Build browser edition
        shell: bash
        run: |
          set -o pipefail
          make -f Makefile.web web 2>&1 | tee web-build.log
      - name: Verify web bundle
        run: |
          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.wasm
          grep -q "CHESS FART" build/web/index.html
          ls -lh build/web
      - name: Browser runtime smoke
        run: |
          npm install --no-save puppeteer-core@24
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/web_smoke.mjs
          test -s build/web-smoke.png
          cat build/web-smoke.txt
      - name: Chromium gameplay playtest
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/web_playtest.mjs
          test -s build/web-playtest/08-after-fart.png
          test -s build/web-playtest/10-after-load.png
          test -s build/web-playtest/hardening/local-black-fart-after.png
          test -s build/web-playtest/hardening/local-white-promotion-pending.png
          test -s build/web-playtest/hardening/local-white-fart-promotion-pending.png
          test -s build/web-playtest/hardening/local-black-checkmate.png
          test -s build/web-playtest/hardening/local-full-00-opening.png
          test -s build/web-playtest/hardening/local-full-16-checkpoint-save.png
          test -s build/web-playtest/hardening/local-full-18-after-load.png
          test -s build/web-playtest/hardening/local-full-23-after-queenside-castle.png
          test -s build/web-playtest/hardening/local-full-24-history.png
          test -s build/web-playtest/hardening/local-full-33-checkmate.png
          grep -q '^LOCAL_BLACK_FART=PASS' build/web-playtest/hardening/hardening.txt
          grep -q '^LOCAL_WHITE_PROMOTION=PASS' build/web-playtest/hardening/hardening.txt
          grep -q '^LOCAL_BLACK_PROMOTION=PASS' build/web-playtest/hardening/hardening.txt
          grep -q '^LOCAL_WHITE_FART_PROMOTION=PASS' build/web-playtest/hardening/hardening.txt
          grep -q '^LOCAL_BLACK_FART_PROMOTION=PASS' build/web-playtest/hardening/hardening.txt
          grep -q '^LOCAL_WHITE_CHECKMATE=PASS' build/web-playtest/hardening/hardening.txt
          grep -q '^LOCAL_BLACK_CHECKMATE=PASS' build/web-playtest/hardening/hardening.txt
          grep -q '^REPLAY_TIMELINE=PASS local-start+2=3 passive-input=no-frame load-reset=1 cpu-start+pair=3$' build/web-playtest/hardening/hardening.txt
          grep -q '^LOCAL_FULL_GAME=PASS opera-game plies=33 rollback=exact-persisted-state replay=2 castling=O-O-O result=CHECKMATE winner=WHITE terminal-lock$' build/web-playtest/hardening/hardening.txt
          cat build/web-playtest/playtest.txt
          cat build/web-playtest/hardening/hardening.txt
      - name: Build 14 visual review states
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/web_visual_review.mjs
          test -s build/web-visual-review/manifest.json
          test -s build/web-visual-review/01-title.png
          test -s build/web-visual-review/04-selected-legal-moves.png
          test -s build/web-visual-review/12-fart-push-preview.png
          test -s build/web-visual-review/13-check.png
          test -s build/web-visual-review/14-checkmate.png
          test -s build/web-visual-review/15-fart-edge-invalid.png
          test -s build/web-visual-review/16-stalemate.png
          test -s build/web-visual-review/17-help-page-2.png
          test -s build/web-visual-review/18-credits.png
          test -s build/web-visual-review/19-title-credits-selected.png
          test -s build/web-visual-review/20-title-2-players-selected.png
          test -s build/web-visual-review/21-local-black-to-move-hud.png
          test -s build/web-visual-review/22-local-history-white-black.png
          test -s build/web-visual-review/23-local-fart-mode-hud.png
          test -s build/web-visual-review/24-local-help-page-2.png
          test -s build/web-visual-review/25-local-black-fart-after.png
          test -s build/web-visual-review/26-local-white-promotion-choice.png
          test -s build/web-visual-review/27-local-white-promotion-rook.png
          test -s build/web-visual-review/28-local-black-promotion-rook.png
          test -s build/web-visual-review/29-local-white-fart-promotion-choice.png
          test -s build/web-visual-review/30-local-black-fart-promotion-rook.png
          test -s build/web-visual-review/31-local-white-checkmate.png
          test -s build/web-visual-review/32-local-black-checkmate.png
          grep -q '^PASS$' build/web-visual-review/visual-review.txt
          grep -q '^states=32$' build/web-visual-review/visual-review.txt
          cat build/web-visual-review/visual-review.txt
      - name: Preserve web diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chessfart-web-diagnostics
          path: |
            web-build.log
            build/assets/ASSET_REPORT.txt
            build/assets/FONT_REPORT.txt
            build/web-smoke.txt
            build/web-smoke.png
            build/web-playtest/
            build/web-visual-review/
      - name: Preserve browser bundle
        uses: actions/upload-artifact@v4
        with:
          name: chessfart-web
          path: build/web/
