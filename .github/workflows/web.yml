name: Web Build

on:
  push:
    branches: [ main, web-playable ]
  pull_request:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.1
          actions-cache-folder: emsdk-cache
      - name: Build browser edition
        shell: bash
        run: |
          set -o pipefail
          make -f Makefile.web web 2>&1 | tee web-build.log
      - name: Verify web bundle
        run: |
          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.wasm
          grep -q "CHESS FART" build/web/index.html
          ls -lh build/web
      - name: Browser runtime smoke
        run: |
          npm install --no-save puppeteer-core@24
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/web_smoke.mjs
          test -s build/web-smoke.png
          cat build/web-smoke.txt
      - name: Chromium gameplay playtest
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/web_playtest.mjs
          test -s build/web-playtest/08-after-fart.png
          test -s build/web-playtest/10-after-load.png
          cat build/web-playtest/playtest.txt
      - name: Chromium CPU Fart tactics
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/web_cpu_tactics.mjs
          test -s build/web-cpu-tactics/tactics.txt
          cat build/web-cpu-tactics/tactics.txt
      - name: Preserve web diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chessfart-web-diagnostics
          path: |
            web-build.log
            build/web-smoke.txt
            build/web-smoke.png
            build/web-playtest/
            build/web-cpu-tactics/
      - name: Preserve browser bundle
        uses: actions/upload-artifact@v4
        with:
          name: chessfart-web
          path: build/web/
